# Cloudflare Pages config (direct upload: build locally, then `wrangler pages deploy dist`).
name = "daisydog"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret runtime config the functions read. Secrets (JWT_SECRET, OPENAI_API_KEY, VOICE_FUNCTION_SECRET)
# (BREVO_API_KEY, CONTACT_TO) live in the Pages project, not here.
[vars]
SITE_URL = "https://daisydog.pages.dev"
MAIL_FROM = "no-reply@txeas.com"

# Parent accounts, dashboard, lessons and child links (replaces Neon).
[[d1_databases]]
binding = "DB"
database_name = "daisydog"
database_id = "c53a1d3e-e90c-4144-b085-2bba74ead3a6"

# Workers AI: free-tier chat model for Daisy, no API key.
[ai]
binding = "AI"
