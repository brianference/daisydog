# Cloudflare Pages config (direct upload: build locally, then `wrangler pages deploy dist`).
name = "daisydog"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Mirrors netlify.toml [build.environment]; the functions read these at runtime.
[vars]
SITE_URL = "https://daisydog.org"
VITE_SUPABASE_URL = "https://lqxstmjczpfywfgyhahj.supabase.co"
VITE_SUPABASE_ANON_KEY = "your_supabase_anon_key_here"

# Parent accounts, dashboard, lessons and child links (replaces Neon).
[[d1_databases]]
binding = "DB"
database_name = "daisydog"
database_id = "c53a1d3e-e90c-4144-b085-2bba74ead3a6"

# Workers AI: free-tier chat model for Daisy, no API key.
[ai]
binding = "AI"
